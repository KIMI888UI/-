<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霓虹贪吃蛇</title>
  <style>
    :root { --bg:#080b18; --panel:#10162a; --line:#273150; --text:#edf3ff; --muted:#8d98b9; --green:#7dffac; --cyan:#62e6ff; --pink:#ff6dbe; }
    * { box-sizing:border-box; }
    body { margin:0; overflow-x:hidden; user-select:none; -webkit-tap-highlight-color:transparent; min-height:100vh; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; background: radial-gradient(circle at 18% 0%,#1a2247 0,transparent 38%), radial-gradient(circle at 100% 80%,#1d1240 0,transparent 33%),var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
    .app { width:min(920px,100%); min-width:0; display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:22px; align-items:start; }
    .brand { grid-column:1/-1; display:flex; align-items:end; justify-content:space-between; margin-bottom:2px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.25rem); letter-spacing:-.07em; line-height:1; }
    .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.22em; font-size:.7rem; font-weight:800; margin:0 0 9px; }
    .tag { color:var(--muted); font-size:.86rem; }
    .card { background:linear-gradient(145deg,rgba(20,28,54,.94),rgba(11,16,33,.94)); border:1px solid var(--line); border-radius:22px; box-shadow:0 22px 70px #02040f88; }
    .game-card { padding:18px; min-width:0; width:100%; }
    .hud { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:0 3px 14px; }
    .score-label { color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; }
    .metric { min-width:0; }
    .score { color:var(--green); font-size:1.7rem; line-height:1; font-weight:850; margin-top:3px; }
    .status { border:1px solid #354367; border-radius:99px; padding:7px 11px; color:var(--cyan); font-size:.72rem; font-weight:700; }
    canvas { display:block; width:100%; max-width:100%; height:auto; touch-action:none; overscroll-behavior:contain; width:100%; aspect-ratio:1; display:block; background:#070b19; border-radius:15px; border:1px solid #2d3961; box-shadow:inset 0 0 50px #0008,0 0 0 5px #0b1124; image-rendering:auto; }
    .side { padding:22px; }
    .side h2 { margin:0 0 16px; font-size:1rem; }
    .tutorial { position:fixed; top:68px; right:18px; z-index:10; } .tutorial summary { width:42px; height:42px; display:grid; place-items:center; cursor:pointer; list-style:none; border:1px solid #4c6a9b; border-radius:50%; background:#132746; color:var(--cyan); font-size:1rem; box-shadow:0 8px 24px #02040f88; } .announcement { position:fixed; top:18px; right:18px; z-index:10; } .announcement summary { width:42px; height:42px; display:grid; place-items:center; cursor:pointer; list-style:none; border:1px solid #4c6a9b; border-radius:50%; background:#132746; color:var(--cyan); font-size:1.1rem; box-shadow:0 8px 24px #02040f88; } .announcement summary::-webkit-details-marker { display:none; } .announcement ul { position:absolute; top:50px; right:0; width:min(280px,calc(100vw - 36px)); margin:0; padding:12px 14px 12px 30px; border:1px solid #35517d; border-radius:14px; background:linear-gradient(135deg,#132746,#101a34); color:#cbd6f5; font-size:.76rem; line-height:1.65; box-shadow:0 14px 35px #02040faa; } .tutorial summary::-webkit-details-marker { display:none; } .tutorial .hint,.tutorial .tip { position:absolute; top:50px; right:0; width:min(280px,calc(100vw - 36px)); margin:0; padding:12px 14px; border:1px solid #35517d; border-radius:14px; background:#101a34; box-shadow:0 14px 35px #02040faa; } .tutorial .hint { color:#cbd6f5; } .tutorial .tip { top:112px; }
    .rule { height:1px; background:var(--line); margin:18px 0; }
    .keys { display:none; display:grid; grid-template-columns:repeat(3,38px); gap:6px; justify-content:center; margin:14px 0 8px; }
    kbd { display:grid; place-items:center; height:35px; border:1px solid #3d4d78; border-radius:9px; background:#161f3a; color:#cbd5f7; font-size:.78rem; box-shadow:0 2px 0 #080b18; }
    kbd:nth-child(1) { grid-column:2; } .keyrow { display:contents; }
    .mobile-pad { display:grid; grid-template-columns:repeat(3,50px); gap:6px; justify-content:center; margin:16px 0 4px; }
    .mobile-pad button { width:50px; height:46px; padding:0; touch-action:manipulation; border:1px solid #3d4d78; background:#161f3a; color:#cbd5f7; border-radius:10px; font-size:1rem; }
    .mobile-pad button:nth-child(1) { grid-column:2; grid-row:1; } .mobile-pad button:nth-child(2) { grid-column:1; grid-row:2; } .mobile-pad button:nth-child(3) { grid-column:2; grid-row:2; } .mobile-pad button:nth-child(4) { grid-column:3; grid-row:2; } .mobile-pad button:active { background:var(--cyan); color:#07101e; transform:scale(.95); }
    .hint { text-align:center; color:var(--muted); font-size:.78rem; margin:0; }
    button { width:100%; border:0; border-radius:12px; padding:12px 14px; color:#081018; background:var(--green); font:inherit; font-weight:800; cursor:pointer; transition:.2s transform,.2s filter; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); } button.secondary { margin-top:9px; background:#1d294b; color:#dce6ff; }
    .tip { color:var(--muted); line-height:1.55; font-size:.78rem; }
    .tip strong { color:#e9eeff; }
    @media (max-width:700px) { body { padding:16px; align-items:center; } .app { grid-template-columns:1fr; width:100%; max-width:520px; } .brand { align-items:flex-start; flex-direction:column; gap:8px; } .hud { justify-content:center; } .side { display:flex; flex-direction:column; align-items:center; gap:0; padding:18px; min-width:0; } .side .keys { display:none; } .side button#start,.side button#pause { max-width:360px; } .side h2,.rule,.tip { width:100%; } .keys { margin:2px 0; } .mobile-pad { margin-left:auto; margin-right:auto; grid-template-columns:repeat(3,58px); gap:8px; } .mobile-pad button { width:58px; height:52px; font-size:1.15rem; } }
  </style>
</head>
<body>
  <details class="announcement"><summary aria-label="打开版本公告">📢</summary><ul><li><strong>v1.5 版本公告</strong></li><li>新增蓝色冻结食物，吃到后减速 5 秒。</li><li>冻结效果不会重复叠加，结束后恢复原速度。</li></ul></details>
  <details class="tutorial"><summary aria-label="打开操作教程">?</summary><p class="hint">电脑端：方向键 / WASD 控制移动<br>手机端：点击下方方向盘</p><p class="tip"><strong>小贴士</strong><br>撞到墙壁或自己的身体会结束游戏。</p></details>
  <main class="app">
    <header class="brand"><div><p class="eyebrow">ARCADE / 01</p><h1>霓虹贪吃蛇</h1></div><span class="tag">吃掉光点，越长越强。</span></header>
    <section class="card game-card">
      <div class="hud">
        <div class="metric"><div class="score-label">当前分数</div><div class="score" id="score">000</div></div>
        <div class="metric"><div class="score-label">最高分</div><div class="score" id="best">000</div></div>
        <div class="status" id="status">准备开始</div>
      </div>
      <canvas id="board" width="600" height="600" aria-label="贪吃蛇游戏区域"></canvas>
    </section>
    <aside class="card side">
<div class="mobile-pad" aria-label="手机方向盘"><button data-dir="up" aria-label="向上，W">W</button><button data-dir="left" aria-label="向左，A">A</button><button data-dir="down" aria-label="向下，S">S</button><button data-dir="right" aria-label="向右，D">D</button></div>
      <div class="rule"></div>
      <button id="start">开始游戏</button><button class="secondary" id="pause">暂停</button>
      <div class="rule"></div>
    </aside>
  </main>
  <script>
    const canvas=document.getElementById('board'), ctx=canvas.getContext('2d'), scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
    const N=20; let snake,foods,dir,nextDir,score,timer,running=false,paused=false, speed=115, wallGrace=false, boostTimer=null, freezeTimer=null, boosted=false, frozen=false;
    let best=Number(localStorage.getItem('snake-best')||0); bestEl.textContent=String(best).padStart(3,'0');
    function randomFoodCount(){const r=Math.random();return r<0.7?1:r<0.95?2:3;}
    function reset(){ snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; foods=[]; dir={x:1,y:0}; nextDir=dir; score=0; scoreEl.textContent='000'; for(let i=0, count=randomFoodCount();i<count;i++)placeFood(); draw(); statusEl.textContent='准备开始'; }
    function placeFood(){ if(foods.length>=3)return; let candidate; do { candidate={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),kind:(()=>{const roll=Math.random();return roll<0.1?'freeze':(roll<0.3?'energy':'normal')})()}; } while(snake?.some(p=>p.x===candidate.x&&p.y===candidate.y)||foods.some(p=>p.x===candidate.x&&p.y===candidate.y)||((candidate.x===0||candidate.x===N-1||candidate.y===0||candidate.y===N-1)&&Math.random()<0.7)); foods.push(candidate); }
    function draw(){ const s=canvas.width/N; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#080d20'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#111a35'; ctx.lineWidth=1; for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*s);ctx.lineTo(canvas.width,i*s);ctx.stroke();} const pulse=1+Math.sin(Date.now()/180)*.08; foods.forEach(food=>{ctx.fillStyle=food.kind==='energy'?'#ffd166':(food.kind==='freeze'?'#4da6ff':'#ff6dbe');ctx.shadowColor=food.kind==='energy'?'#ffd166':(food.kind==='freeze'?'#4da6ff':'#ff6dbe');ctx.shadowBlur=18;ctx.beginPath();ctx.arc((food.x+.5)*s,(food.y+.5)*s,s*.25*pulse,0,Math.PI*2);ctx.fill();});ctx.shadowBlur=0; snake.forEach((p,i)=>{const frozenColor=frozen?(i?'#3d8cff':'#8fc7ff'):(i?'#47e58b':'#9affc0');ctx.fillStyle=frozenColor;ctx.shadowColor=frozen?'#4da6ff':'#44f39a';ctx.shadowBlur=i?9:18; roundRect(ctx,p.x*s+2,p.y*s+2,s-4,s-4,7);ctx.fill();});ctx.shadowBlur=0; }
    function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
    function tick(){ if(!running||paused)return; dir=nextDir; const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y}; const eatenIndex=foods.findIndex(food=>head.x===food.x&&head.y===food.y); const willEat=eatenIndex>=0; const occupied=snake; if(head.x<0||head.x>=N||head.y<0||head.y>=N){if(!wallGrace){wallGrace=true;statusEl.textContent='靠近边界，快转向！';return;}running=false;clearInterval(timer);statusEl.textContent='游戏结束';if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}return;} if(!willEat&&occupied.some(p=>p.x===head.x&&p.y===head.y)){running=false;clearInterval(timer);statusEl.textContent='游戏结束';if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}return;} wallGrace=false;if(statusEl.textContent==='靠近边界，快转向！')statusEl.textContent='游戏中'; snake.unshift(head); if(willEat){const eatenFood=foods.splice(eatenIndex,1)[0]; const growth=eatenFood.kind==='energy'?2:1;score+=eatenFood.kind==='energy'?20:10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}if(eatenFood.kind==='energy'&&!boosted){boosted=true;speed=frozen?180:80;clearInterval(timer);timer=setInterval(tick,speed);boostTimer=setTimeout(()=>{boosted=false;speed=frozen?180:115;if(running&&!paused){clearInterval(timer);timer=setInterval(tick,speed);}},5000);}if(eatenFood.kind==='freeze'&&!frozen){frozen=true;statusEl.textContent='冻结减速中';speed=boosted?80:180;clearInterval(timer);timer=setInterval(tick,speed);freezeTimer=setTimeout(()=>{frozen=false;statusEl.textContent=running?'游戏中':'准备开始';speed=boosted?80:115;if(running&&!paused){clearInterval(timer);timer=setInterval(tick,speed);}},5000);}for(let i=1;i<growth;i++)snake.push({...snake[snake.length-1]});const target=randomFoodCount();while(foods.length<target)placeFood();}else snake.pop(); draw(); }
    function start(){clearInterval(timer);if(boostTimer)clearTimeout(boostTimer);if(freezeTimer)clearTimeout(freezeTimer);reset();running=true;paused=false;wallGrace=false;boosted=false;frozen=false;speed=115;statusEl.textContent='游戏中';timer=setInterval(tick,speed);}
    function setDir(x,y){if(!running){start();}if(x!==-dir.x||y!==-dir.y)nextDir={x,y};}
    document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(map[k]){e.preventDefault();setDir(...map[k]);}if(k==='p'&&running){paused=!paused;statusEl.textContent=paused?'已暂停':'游戏中';}});
    document.querySelectorAll('[data-dir]').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[btn.dataset.dir];setDir(...d);}));
    document.getElementById('start').onclick=start; document.getElementById('pause').onclick=()=>{if(running){paused=!paused;statusEl.textContent=paused?'已暂停':'游戏中';}};
    let touch; canvas.addEventListener('touchstart',e=>{e.preventDefault();touch=e.touches[0];},{passive:false}); canvas.addEventListener('touchend',e=>{e.preventDefault();if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.clientX,dy=t.clientY-touch.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0);touch=null;},{passive:true}); reset();
  </script>
</body>
</html>
