<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霓虹贪吃蛇</title>
  <style>
    :root { --bg:#080b18; --panel:#10162a; --line:#273150; --text:#edf3ff; --muted:#8d98b9; --green:#7dffac; --cyan:#62e6ff; --pink:#ff6dbe; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; background: radial-gradient(circle at 18% 0%,#1a2247 0,transparent 38%), radial-gradient(circle at 100% 80%,#1d1240 0,transparent 33%),var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
    .app { width:min(920px,100%); display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:22px; align-items:start; }
    .brand { grid-column:1/-1; display:flex; align-items:end; justify-content:space-between; margin-bottom:2px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.25rem); letter-spacing:-.07em; line-height:1; }
    .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.22em; font-size:.7rem; font-weight:800; margin:0 0 9px; }
    .tag { color:var(--muted); font-size:.86rem; }
    .card { background:linear-gradient(145deg,rgba(20,28,54,.94),rgba(11,16,33,.94)); border:1px solid var(--line); border-radius:22px; box-shadow:0 22px 70px #02040f88; }
    .game-card { padding:18px; }
    .hud { display:flex; justify-content:space-between; align-items:center; padding:0 3px 14px; }
    .score-label { color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; }
    .score { color:var(--green); font-size:1.7rem; line-height:1; font-weight:850; margin-top:3px; }
    .status { border:1px solid #354367; border-radius:99px; padding:7px 11px; color:var(--cyan); font-size:.72rem; font-weight:700; }
    canvas { touch-action:none; overscroll-behavior:contain; width:100%; aspect-ratio:1; display:block; background:#070b19; border-radius:15px; border:1px solid #2d3961; box-shadow:inset 0 0 50px #0008,0 0 0 5px #0b1124; image-rendering:auto; }
    .side { padding:22px; }
    .side h2 { margin:0 0 16px; font-size:1rem; }
    .rule { height:1px; background:var(--line); margin:18px 0; }
    .keys { display:grid; grid-template-columns:repeat(3,38px); gap:6px; justify-content:center; margin:14px 0 8px; }
    kbd { display:grid; place-items:center; height:35px; border:1px solid #3d4d78; border-radius:9px; background:#161f3a; color:#cbd5f7; font-size:.78rem; box-shadow:0 2px 0 #080b18; }
    kbd:nth-child(1) { grid-column:2; } .keyrow { display:contents; }
    .mobile-pad { display:grid; grid-template-columns:repeat(3,44px); gap:6px; justify-content:center; margin:16px 0 4px; }
    .mobile-pad button { width:44px; height:40px; padding:0; border:1px solid #3d4d78; background:#161f3a; color:#cbd5f7; border-radius:10px; font-size:1rem; }
    .mobile-pad button:first-child { grid-column:2; } .mobile-pad button:active { background:var(--cyan); color:#07101e; transform:scale(.95); }
    .hint { text-align:center; color:var(--muted); font-size:.78rem; margin:0; }
    button { width:100%; border:0; border-radius:12px; padding:12px 14px; color:#081018; background:var(--green); font:inherit; font-weight:800; cursor:pointer; transition:.2s transform,.2s filter; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); } button.secondary { margin-top:9px; background:#1d294b; color:#dce6ff; }
    .tip { color:var(--muted); line-height:1.55; font-size:.78rem; }
    .tip strong { color:#e9eeff; }
    @media (max-width:700px) { body { padding:16px; align-items:flex-start; } .app { grid-template-columns:1fr; max-width:520px; } .brand { align-items:flex-start; flex-direction:column; gap:8px; } .side { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:18px; } .side h2,.rule,.tip { grid-column:1/-1; } .keys { margin:2px 0; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand"><div><p class="eyebrow">ARCADE / 01</p><h1>霓虹贪吃蛇</h1></div><span class="tag">吃掉光点，越长越强。</span></header>
    <section class="card game-card">
      <div class="hud"><div><div><div class="score-label">当前分数</div><div class="score" id="score">000</div></div><div><div class="score-label">最高分</div><div class="score" id="best">000</div></div><div class="status" id="status">准备开始</div></div>
      <canvas id="board" width="600" height="600" aria-label="贪吃蛇游戏区域"></canvas>
    </section>
    <aside class="card side">
      <h2>操作说明</h2>
      <div class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div>
      <p class="hint">方向键 / WASD 控制移动</p><div class="mobile-pad" aria-label="手机方向盘"><button data-dir="up" aria-label="向上">▲</button><button data-dir="left" aria-label="向左">◀</button><button data-dir="down" aria-label="向下">▼</button><button data-dir="right" aria-label="向右">▶</button></div>
      <div class="rule"></div>
      <button id="start">开始游戏</button><button class="secondary" id="pause">暂停</button>
      <div class="rule"></div>
      <p class="tip"><strong>小贴士</strong><br>撞到墙壁或自己的身体就会结束。屏幕下方也支持滑动操作。</p>
    </aside>
  </main>
  <script>
    const canvas=document.getElementById('board'), ctx=canvas.getContext('2d'), scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
    const N=20; let snake,food,dir,nextDir,score,timer,running=false,paused=false, speed=115, wallGrace=false, boostTimer=null, boosted=false;
    let best=Number(localStorage.getItem('snake-best')||0); bestEl.textContent=String(best).padStart(3,'0');
    function reset(){ snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir={x:1,y:0}; nextDir=dir; score=0; scoreEl.textContent='000'; placeFood(); draw(); statusEl.textContent='准备开始'; }
    function placeFood(){ do { food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),kind:Math.random()<0.2?'energy':'normal'}; } while(snake?.some(p=>p.x===food.x&&p.y===food.y)); }
    function draw(){ const s=canvas.width/N; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#080d20'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#111a35'; ctx.lineWidth=1; for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*s);ctx.lineTo(canvas.width,i*s);ctx.stroke();} const pulse=1+Math.sin(Date.now()/180)*.08; ctx.fillStyle=food.kind==='energy'?'#ffd166':'#ff6dbe'; ctx.shadowColor=food.kind==='energy'?'#ffd166':'#ff6dbe';ctx.shadowBlur=18;ctx.beginPath();ctx.arc((food.x+.5)*s,(food.y+.5)*s,s*.25*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0; snake.forEach((p,i)=>{ctx.fillStyle=i?'#47e58b':'#9affc0';ctx.shadowColor='#44f39a';ctx.shadowBlur=i?9:18; roundRect(ctx,p.x*s+2,p.y*s+2,s-4,s-4,7);ctx.fill();});ctx.shadowBlur=0; }
    function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
    function tick(){ if(!running||paused)return; dir=nextDir; const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y}; const willEat=head.x===food.x&&head.y===food.y; const occupied=willEat?snake:snake.slice(0,-1); if(head.x<0||head.x>=N||head.y<0||head.y>=N){if(!wallGrace){wallGrace=true;statusEl.textContent='靠近边界，快转向！';return;}running=false;clearInterval(timer);statusEl.textContent='游戏结束';if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}return;} if(occupied.some(p=>p.x===head.x&&p.y===head.y)){running=false;clearInterval(timer);statusEl.textContent='游戏结束';if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}return;} wallGrace=false; snake.unshift(head); if(willEat){const growth=food.kind==='energy'?2:1;score+=food.kind==='energy'?20:10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}if(food.kind==='energy'&&!boosted){boosted=true;speed=80;clearInterval(timer);timer=setInterval(tick,speed);boostTimer=setTimeout(()=>{boosted=false;speed=115;if(running&&!paused){clearInterval(timer);timer=setInterval(tick,speed);}},5000);}for(let i=1;i<growth;i++)snake.push({...snake[snake.length-1]});placeFood();}else snake.pop(); draw(); }
    function start(){clearInterval(timer);if(boostTimer)clearTimeout(boostTimer);reset();running=true;paused=false;wallGrace=false;boosted=false;speed=115;statusEl.textContent='游戏中';timer=setInterval(tick,speed);}
    function setDir(x,y){if(!running){start();}if(x!==-dir.x||y!==-dir.y)nextDir={x,y};}
    document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(map[k]){e.preventDefault();setDir(...map[k]);}if(k==='p'&&running){paused=!paused;statusEl.textContent=paused?'已暂停':'游戏中';}});
    document.querySelectorAll('[data-dir]').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[btn.dataset.dir];setDir(...d);}));
    document.getElementById('start').onclick=start; document.getElementById('pause').onclick=()=>{if(running){paused=!paused;statusEl.textContent=paused?'已暂停':'游戏中';}};
    let touch; canvas.addEventListener('touchstart',e=>{e.preventDefault();touch=e.touches[0];},{passive:false}); canvas.addEventListener('touchend',e=>{e.preventDefault();if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.clientX,dy=t.clientY-touch.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0);touch=null;},{passive:true}); reset();
  </script>
</body>
</html>
